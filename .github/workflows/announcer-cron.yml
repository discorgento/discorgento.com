name: Announcer cron (Cloudflare)

# Deploys workers/announcer-cron — the punctual clock for the Substack → Discord
# announcer. GitHub's own `schedule` dispatcher has no SLA (delays are
# documented, queued runs can be dropped) and was measured 6–10 h behind the
# nominal minute in this org, so the timer lives on a Cloudflare cron trigger and
# calls workflow_dispatch. The announcement itself is still GitHub Actions. See
# AGENTS.md.

on:
  push:
    branches: [main]
    paths:
      - "workers/announcer-cron/**"
      - ".github/workflows/announcer-cron.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: announcer-cron
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the cron Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Only for the wrangler version pinned in the lockfile; nothing is built.
      - run: npm ci
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/announcer-cron/wrangler.jsonc
      # The PAT never lives in the repo: it is pushed into the Worker as a
      # secret on every deploy, so rotating it is a one-place change (the repo
      # secret). Skipped with a warning when absent, so the Worker still deploys
      # before the PAT exists — it just cannot dispatch anything yet.
      - name: Sync the dispatch token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.ANNOUNCER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::ANNOUNCER_DISPATCH_TOKEN is not set — every dispatch from the cron Worker will fail until it is."
            exit 0
          fi
          printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put DISPATCH_TOKEN --config workers/announcer-cron/wrangler.jsonc
